name: Evaluate (MVTec AD)
# Manually triggered, reproducible benchmark run. Downloads one MVTec AD category from the
# public Hugging Face mirror (CC BY-NC-SA 4.0, not redistributed here), trains Baseline A,
# calibrates thresholds on held-out normals and uploads the metrics report (no images).
on:
  workflow_dispatch:
    inputs:
      method:
        description: "knn_patch or autoencoder"
        default: knn_patch
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1 torchvision==0.22.1
          pip install -e . huggingface_hub
      - name: Fetch data
        run: |
          python - <<'PY'
          from inspectedge.data.hf_mirror import fetch_category as f
          f("bottle", "data/raw/mvtec_ad")
          # Other objects, test split only: used solely to measure the out-of-scope gate.
          for c in ("cable", "screw", "hazelnut", "metal_nut", "toothbrush", "carpet"):
              f(c, "data/raw/mvtec_ad", splits=("test",))
          PY
      - name: Prepare (integrity + leakage checks)
        run: python -m inspectedge.data.prepare
      - name: Train + evaluate
        run: >-
          python -m inspectedge.evaluation.run_eval --method ${{ inputs.method }}
          --ood-categories cable,screw,hazelnut,metal_nut,toothbrush,carpet
      - name: Publish report to the run summary
        run: |
          echo '## Evaluation report' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python -c "import glob,json;r=json.load(open(glob.glob('reports/runs/*/metrics.json')[0]));r.pop('error_gallery',None);r['provenance'].pop('config',None);print(json.dumps(r,indent=1))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: eval-report
          path: reports/runs/*/metrics.json
