name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.10", "3.11"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[api,dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=inspectedge --cov-report=term-missing

  # End-to-end check that the manifests work on a clean cluster. No trained model exists in CI
  # (MVTec AD is not redistributed), so the base image is deployed with REQUIRE_MODEL=false:
  # this proves apply, probes, Service routing, metrics, self-healing and HPA metrics, not
  # inference. Inference under load is measured locally (docs/kubernetes.md).
  k8s-smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 40
    env:
      NS: inspectedge
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: inspectedge-ai-model:0.2.0
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - name: Load image and install Metrics Server
        run: |
          kind load docker-image inspectedge-ai-model:0.2.0 --name ci
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
      - name: Apply manifests on the clean cluster
        run: |
          kubectl apply -k k8s/
          kubectl -n $NS set env deployment/inspectedge-api INSPECTEDGE_REQUIRE_MODEL=false
          kubectl -n $NS rollout status deployment/inspectedge-api --timeout=300s
          kubectl -n $NS get pods,svc,hpa -o wide
      - name: Service answers health, readiness and metrics
        run: |
          kubectl -n $NS port-forward svc/inspectedge-api 18080:80 & sleep 5
          curl -fsS localhost:18080/health/live
          curl -fsS localhost:18080/health/ready
          curl -fsS localhost:18080/metrics | grep inspectedge_http_requests_total
      - name: Deleted pod is recreated
        run: |
          POD=$(kubectl -n $NS get pods -l app.kubernetes.io/name=inspectedge-api -o jsonpath='{.items[0].metadata.name}')
          kubectl -n $NS delete pod "$POD" --wait=false
          sleep 3
          kubectl -n $NS rollout status deployment/inspectedge-api --timeout=180s
          kubectl -n $NS wait --for=condition=Ready pod -l app.kubernetes.io/name=inspectedge-api --timeout=180s
      - name: Unready pod leaves Service endpoints without restarting
        run: |
          POD=$(kubectl -n $NS get pods -l app.kubernetes.io/name=inspectedge-api -o jsonpath='{.items[0].metadata.name}')
          IP=$(kubectl -n $NS get pod "$POD" -o jsonpath='{.status.podIP}')
          eps() { kubectl -n $NS get endpointslices -l kubernetes.io/service-name=inspectedge-api \
                  -o jsonpath='{range .items[*].endpoints[*]}{.addresses[0]} {.conditions.ready}{"\n"}{end}'; }
          kubectl -n $NS exec "$POD" -- touch /tmp/inspectedge.drain
          for i in $(seq 30); do eps | grep -q "^$IP false" && break; sleep 1; done
          eps | grep "^$IP false"
          test "$(kubectl -n $NS get pod "$POD" -o jsonpath='{.status.containerStatuses[0].restartCount}')" = 0
          kubectl -n $NS exec "$POD" -- rm /tmp/inspectedge.drain
          for i in $(seq 30); do eps | grep -q "^$IP true" && break; sleep 1; done
          eps | grep "^$IP true"
      - name: HPA reads CPU metrics
        run: |
          for i in $(seq 36); do
            kubectl -n $NS get hpa inspectedge-api -o jsonpath='{.status.currentMetrics[0].resource.current.averageUtilization}' | grep -q '[0-9]' && break
            sleep 5
          done
          kubectl -n $NS get hpa inspectedge-api
          kubectl -n $NS top pods
      - name: Clean up
        if: always()
        run: |
          kubectl -n $NS get events --sort-by=.lastTimestamp | tail -30 || true
          kubectl delete -k k8s/ --wait=true
