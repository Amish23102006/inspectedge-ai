apiVersion: v1
kind: Service
metadata:
  name: inspectedge-api
  namespace: inspectedge
  labels:
    app.kubernetes.io/name: inspectedge-api
    app.kubernetes.io/part-of: inspectedge-ai
spec:
  type: ClusterIP
  # Only pods passing /health/ready are added to this Service's endpoints.
  selector:
    app.kubernetes.io/name: inspectedge-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
