apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inspectedge-api
  namespace: inspectedge
  labels:
    app.kubernetes.io/name: inspectedge-api
    app.kubernetes.io/part-of: inspectedge-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inspectedge-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Percent of the CPU *request* (250m), averaged over ready pods.
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      # Shorter than the 300 s default so a local demo shows scale-down within minutes.
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
