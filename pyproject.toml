[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspectedge-ai"
version = "0.1.0"
description = "Research/portfolio prototype: explainable industrial anomaly detection with human review and edge benchmarking."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Amish Chaturvedi" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=10.0",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
ml = ["torch>=2.1", "torchvision>=0.16"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dashboard = ["streamlit>=1.32", "requests>=2.31"]
edge = ["onnx>=1.15", "onnxruntime>=1.17"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27", "ruff>=0.4", "mypy>=1.8", "types-PyYAML", "types-requests"]

[project.scripts]
inspectedge-prepare = "inspectedge.data.prepare:main"
inspectedge-eval = "inspectedge.evaluation.run_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008"]  # FastAPI File()/Form() defaults

[tool.ruff.lint.isort]
known-first-party = ["inspectedge", "api"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
